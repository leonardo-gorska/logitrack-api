version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: logitrack-db
    restart: always
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logitrack_user -d logitrack_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: logitrack-api
    restart: always
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - ./app:/app/app # Live reload para desenvolvimento (opcional local, mas util)
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
